name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clona el repo
      - uses: actions/checkout@v4

      # 2️⃣ Configura Java (JDK 17)
      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # 3️⃣ Dar permisos de ejecución a gradlew
      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      # 4️⃣ Configurar SDK y Build Tools
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: 34.0.0

      # 5️⃣ Compilar APK de debug
      - name: Compilar APK
        run: ./gradlew assembleDebug

      # 6️⃣ Subir APK como artifact
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MaulinetZ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
